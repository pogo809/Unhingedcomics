<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PashaNandan — Chapter 1</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0b0b0f; color: #fff; font-family: Arial, sans-serif; }
    body { padding-bottom: 70px; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(11,11,15,.94);
      border-bottom: 1px solid #292932; backdrop-filter: blur(10px);
    }
    .title { font-weight: 800; font-size: 16px; }
    .progress { font-size: 13px; color: #aaa; }
    .reader { max-width: 900px; margin: 0 auto; }
    .page {
      display: block; width: 100%; height: auto; margin: 0 auto;
      background: #15151b;
      user-select: none; -webkit-user-drag: none;
    }
    .controls {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center;
      background: rgba(20,20,27,.94); border: 1px solid #33333d;
      border-radius: 999px; padding: 8px; z-index: 20;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
    }
    button {
      border: 0; border-radius: 999px; padding: 9px 14px;
      background: #292934; color: white; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .4; cursor: default; }
    #fullscreen { font-size: 16px; padding: 9px 12px; }
    .loading { text-align: center; padding: 50px 20px; color: #aaa; }
    @media (min-width: 901px) {
      .page { margin-bottom: 2px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">PashaNandan — Chapter 1</div>
    <div class="progress" id="progress">Page 1 / 11</div>
  </div>

  <main class="reader" id="reader">
    <div class="loading" id="loading">Loading comic…</div>
  </main>

  <div class="controls">
    <button id="prev" aria-label="Previous page">←</button>
    <button id="next" aria-label="Next page">→</button>
    <button id="fullscreen" aria-label="Fullscreen">⛶</button>
  </div>

  <script>
    const totalPages = 11;
    const reader = document.getElementById("reader");
    const progress = document.getElementById("progress");
    const loading = document.getElementById("loading");
    const pages = [];

    for (let i = 1; i <= totalPages; i++) {
      const img = document.createElement("img");
      img.className = "page";
      img.alt = `PashaNandan Chapter 1 — Page ${i}`;
      img.loading = i === 1 ? "eager" : "lazy";
      img.decoding = "async";
      img.src = `comics/pashanandan/chapter-01/page-${String(i).padStart(2, "0")}.webp`;
      reader.appendChild(img);
      pages.push(img);
    }
    loading.remove();

    function currentPage() {
      let best = 1, bestDistance = Infinity;
      pages.forEach((page, i) => {
        const distance = Math.abs(page.getBoundingClientRect().top - 80);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = i + 1;
        }
      });
      return best;
    }

    function updateProgress() {
      progress.textContent = `Page ${currentPage()} / ${totalPages}`;
    }

    document.getElementById("prev").onclick = () => {
      const p = Math.max(1, currentPage() - 1);
      pages[p - 1].scrollIntoView({ behavior: "smooth", block: "start" });
    };

    document.getElementById("next").onclick = () => {
      const p = Math.min(totalPages, currentPage() + 1);
      pages[p - 1].scrollIntoView({ behavior: "smooth", block: "start" });
    };

    document.getElementById("fullscreen").onclick = async () => {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    };

    window.addEventListener("scroll", updateProgress, { passive: true });
    updateProgress();
  </script>
</body>
</html>
