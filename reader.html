<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unhinged Comics Reader</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #0b0b0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      padding-bottom: 70px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(11,11,15,.94);
      border-bottom: 1px solid #292932;
      backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .progress {
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
    }

    .reader {
      max-width: 900px;
      margin: 0 auto;
    }

    .page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      background: #15151b;
      user-select: none;
      -webkit-user-drag: none;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(20,20,27,.94);
      border: 1px solid #33333d;
      border-radius: 999px;
      padding: 8px;
      z-index: 20;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      background: #292934;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: default;
    }

    #fullscreen {
      font-size: 16px;
      padding: 9px 12px;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
    }

    .error {
      text-align: center;
      padding: 60px 20px;
      color: #ff6b6b;
    }

    @media (min-width: 901px) {
      .page {
        margin-bottom: 2px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="title" id="title">Loading…</div>
    <div class="progress" id="progress">Loading…</div>
  </div>

  <main class="reader" id="reader">
    <div class="loading" id="loading">Loading comic…</div>
  </main>

  <div class="controls">
    <button id="prev" aria-label="Previous page">←</button>
    <button id="next" aria-label="Next page">→</button>
    <button id="fullscreen" aria-label="Fullscreen">⛶</button>
  </div>

  <script>
    const REPO = "pogo809/Unhingedcomics";
    const API = `https://api.github.com/repos/${REPO}/contents`;
    const RAW = `https://raw.githubusercontent.com/${REPO}/main`;

    const params = new URLSearchParams(window.location.search);

    const comic = params.get("comic");
    const chapter = params.get("chapter");

    const reader = document.getElementById("reader");
    const progress = document.getElementById("progress");
    const loading = document.getElementById("loading");
    const title = document.getElementById("title");

    const pages = [];

    let totalPages = 0;

    function pretty(text) {
      return decodeURIComponent(text || "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function pageUrl(fileName) {
      return `${RAW}/${encodeURI(
        `comics/${comic}/${chapter}/${fileName}`
      )}`;
    }

    async function loadPages() {
      try {

        if (!comic || !chapter) {
          throw new Error("Missing comic or chapter");
        }

        title.textContent =
          `${pretty(comic)} — ${pretty(chapter)}`;

        const path =
          `comics/${comic}/${chapter}`;

        const response =
          await fetch(`${API}/${encodeURIComponent(path)}`);

        if (!response.ok) {
          throw new Error(`GitHub error: ${response.status}`);
        }

        const files = await response.json();

        const imageFiles = files
          .filter(file =>
            file.type === "file" &&
            /\.(webp|jpg|jpeg|png)$/i.test(file.name)
          )
          .sort((a, b) =>
            a.name.localeCompare(
              b.name,
              undefined,
              { numeric: true }
            )
          );

        if (!imageFiles.length) {
          throw new Error("No comic pages found");
        }

        totalPages = imageFiles.length;

        imageFiles.forEach((file, i) => {

          const img = document.createElement("img");

          img.className = "page";

          img.alt =
            `${pretty(comic)} ${pretty(chapter)} — Page ${i + 1}`;

          img.loading =
            i === 0 ? "eager" : "lazy";

          img.decoding = "async";

          img.src = pageUrl(file.name);

          reader.appendChild(img);

          pages.push(img);
        });

        loading.remove();

        updateProgress();

      } catch (error) {

        console.error(error);

        loading.remove();

        reader.innerHTML = `
          <div class="error">
            <h2>Could not load this chapter</h2>
            <p>${error.message}</p>
          </div>
        `;

        title.textContent = "Reader Error";
        progress.textContent = "";
      }
    }

    function currentPage() {

      if (!pages.length) return 1;

      let best = 1;
      let bestDistance = Infinity;

      pages.forEach((page, i) => {

        const distance =
          Math.abs(
            page.getBoundingClientRect().top - 80
          );

        if (distance < bestDistance) {
          bestDistance = distance;
          best = i + 1;
        }

      });

      return best;
    }

    function updateProgress() {

      if (!totalPages) return;

      progress.textContent =
        `Page ${currentPage()} / ${totalPages}`;
    }

    document.getElementById("prev").onclick = () => {

      if (!pages.length) return;

      const p =
        Math.max(1, currentPage() - 1);

      pages[p - 1].scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    };

    document.getElementById("next").onclick = () => {

      if (!pages.length) return;

      const p =
        Math.min(totalPages, currentPage() + 1);

      pages[p - 1].scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    };

    document.getElementById("fullscreen").onclick =
      async () => {

        if (!document.fullscreenElement) {

          await document.documentElement
            .requestFullscreen?.();

        } else {

          await document.exitFullscreen?.();

        }
      };

    window.addEventListener(
      "scroll",
      updateProgress,
      { passive: true }
    );

    loadPages();
  </script>

</body>
</html>
